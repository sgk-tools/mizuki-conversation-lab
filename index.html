<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mizuki Conversation Lab v0.1.4</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--text:#17181b;--sub:#6f737b;--line:#e6e8ec;
  --accent:#4b79ff;--accent2:#eef3ff;--user:#4b79ff;--mizuki:#fff;
  --ok:#1c8b55;--ng:#c84a4a;--shadow:0 10px 30px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
.app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
.header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:relative;z-index:10}
.headrow{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#e8eeff,#fff);display:grid;place-items:center;font-weight:700;box-shadow:inset 0 0 0 1px #dfe6ff}
.identity{min-width:0;flex:1}
.name{font-size:17px;font-weight:700;line-height:1.2}
.meta{font-size:12px;color:var(--sub);margin-top:2px}
.iconbtn{border:0;background:#f1f2f5;border-radius:12px;width:42px;height:42px;font-size:19px}
.scenario{margin:10px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.035)}
.scenario-top{display:flex;align-items:center;gap:8px}
.testno{font-weight:800;font-size:13px;letter-spacing:.04em}
.spacer{flex:1}
.nextbtn{border:0;background:var(--accent2);color:#315cd6;border-radius:10px;padding:8px 11px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:#f4f5f7;border:1px solid #e9eaed;border-radius:999px;padding:5px 8px;color:#4d5159}
.chat{flex:1;overflow-y:auto;padding:14px 12px 18px;scroll-behavior:smooth}
.row{display:flex;margin:9px 0;align-items:flex-end;gap:7px}
.row.user{justify-content:flex-end}
.bubble{max-width:84%;padding:10px 12px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
.mizuki .bubble{background:var(--mizuki);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.035)}
.user .bubble{background:var(--user);color:white;border-bottom-right-radius:6px}
.eval{display:flex;gap:7px;margin:5px 0 0 31px;align-items:center;flex-wrap:wrap}
.eval button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;color:#555}
.eval button.selected.natural{border-color:#b9dfcc;color:var(--ok);background:#f0faf5}
.eval button.selected.unnatural{border-color:#efc2c2;color:var(--ng);background:#fff4f4}
.improve{margin:7px 0 0 31px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;display:none}
.improve.show{display:block}
.improve textarea{width:100%;min-height:64px;resize:vertical;border:1px solid #dfe2e8;border-radius:10px;padding:9px;outline:none}
.improve-actions{display:flex;justify-content:flex-end;margin-top:7px}
.smallbtn{border:0;background:#edf1ff;color:#345fd8;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
.thinking{margin:6px 0 0 31px;display:none}
.thinking.show{display:block}
.thinking details{font-size:11px;color:#666;background:#f0f1f4;border-radius:10px;padding:7px 9px}
.thinking pre{white-space:pre-wrap;margin:7px 0 0;font-size:10px;line-height:1.45}
.composer{background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:43px;max-height:112px;resize:none;border:1px solid #dfe2e8;border-radius:15px;padding:11px 12px;outline:none;background:#fff;line-height:1.35}
.send{border:0;background:var(--accent);color:white;border-radius:14px;min-width:62px;height:43px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(12,15,20,.28);display:none;align-items:flex-end;z-index:30}
.overlay.show{display:flex}
.sheet{width:min(100%,520px);margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:82dvh;overflow:auto;box-shadow:var(--shadow)}
.sheet h2{font-size:18px;margin:0 0 14px}
.setting{padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}
.setting input[type=text]{width:100%;border:1px solid #dfe2e8;border-radius:11px;padding:10px}
.switchline{display:flex;align-items:center;justify-content:space-between;gap:14px}
.action{width:100%;border:0;border-radius:12px;padding:11px 12px;text-align:left;background:#f4f5f7;margin:5px 0}
.action.danger{color:#b23d3d;background:#fff2f2}
.close{width:100%;border:0;border-radius:13px;padding:12px;background:#202227;color:#fff;font-weight:800;margin-top:12px}
.notice{font-size:11px;color:var(--sub);line-height:1.5}
.empty{color:#868a92;text-align:center;font-size:13px;margin-top:40px}
.version{font-size:11px;color:#8a8e96;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="headrow">
      <div class="avatar" id="avatar">美</div>
      <div class="identity">
        <div class="name">橘 美月</div>
        <div class="meta"><span id="expressionLabel">normal</span> · Mizuki Conversation Lab</div>
      </div>
      <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙︎</button>
    </div>
  </header>

  <section class="scenario">
    <div class="scenario-top">
      <div class="testno" id="testNo">TEST 1</div>
      <div class="spacer"></div>
      <button class="nextbtn" id="nextTestBtn">次のテスト</button>
    </div>
    <div class="chips" id="scenarioChips"></div>
  </section>

  <main class="chat" id="chat">
    <div class="empty" id="empty">この状況を見て、美月に自由に話しかけてください。</div>
  </main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="美月に話しかける…"></textarea>
    <button class="send" id="sendBtn">送信</button>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>設定</h2>
    <div class="setting">
      <label for="callName">美月からの呼ばれ方</label>
      <input id="callName" type="text" maxlength="20" placeholder="例：シゲキさん、鈴木さん">
      <div class="notice">空欄なら呼び名を使いません。入力内容はこの端末内に保存されます。</div>
    </div>
    <div class="setting switchline">
      <div>
        <b style="font-size:13px">開発モード</b>
        <div class="notice">美月の判断過程を表示します。</div>
      </div>
      <input id="debugToggle" type="checkbox" style="width:24px;height:24px">
    </div>
    <div class="setting">
      <button class="action" id="exportBtn">評価データをJSON出力</button>
      <button class="action" id="manualScenarioBtn">現在の想定状況を変更</button>
    </div>
    <div class="setting">
      <button class="action danger" data-clear="chat">会話履歴をクリア</button>
      <button class="action danger" data-clear="memory">Memoryをクリア</button>
      <button class="action danger" data-clear="evaluations">評価データをクリア</button>
    </div>
    <button class="close" id="closeSettings">閉じる</button>
    <div class="version">Mizuki Conversation Lab v0.1.6 single HTML</div>
  </div>
</div>

<script>
(() => {
'use strict';

const VERSION='0.1.6-single';
const K={
  settings:'mcl_settings_v012',
  history:'mcl_history_v012',
  evals:'mcl_evals_v012',
  longMemory:'mcl_long_memory_v012',
  scenario:'mcl_scenario_v012',
  testNo:'mcl_test_no_v012',
  coverage:'mcl_coverage_v012',
  dialogState:'mcl_dialog_state_v016'
};
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let settings=load(K.settings,{callName:'',debug:false});
let history=load(K.history,[]);
let evaluations=load(K.evals,[]);
let longMemory=load(K.longMemory,[]);
let coverage=load(K.coverage,{pairs:{},usedScenarios:[]});
let testNo=load(K.testNo,1);
let dialogState=load(K.dialogState,{memoryCursorId:null,suppressWork:false});

const levels={
  workStatus:['通常勤務','休日','休日出勤','勤務終了後'],
  timeBand:['朝','昼','夕方','夜','深夜'],
  workload:['普通','多い','少ない'],
  nextPlan:['なし','通常業務','打合せ','外出'],
  completed:['なし','1件完了','複数完了'],
  dayType:['平日','金曜','土曜','日曜'],
  testType:['basic','contextCombination','memory','repetition','care','advice','smalltalk','silence']
};

function rand(a){return a[Math.floor(Math.random()*a.length)]}
function timeForBand(b){
  const hour=({朝:8,昼:12,夕方:17,夜:21,深夜:0})[b];
  const minute=[0,10,15,20,30,40,45,50][Math.floor(Math.random()*8)];
  return {hour,minute};
}
function validateScenario(s){
  if(s.workStatus==='休日'){
    s.workload='少ない'; s.nextPlan='なし'; s.completed='なし';
  }
  if(s.workStatus==='勤務終了後'){
    s.nextPlan='なし';
    if(s.timeBand==='朝'||s.timeBand==='昼') s.timeBand=rand(['夕方','夜','深夜']);
  }
  if(s.dayType==='日曜' && s.workStatus==='通常勤務') s.workStatus=Math.random()<.5?'休日':'休日出勤';
  if(s.workStatus==='休日出勤' && s.workload==='少ない' && s.completed==='なし' && Math.random()<.5) s.workload='普通';
  return s;
}
function pairKey(a,av,b,bv){return [a,av,b,bv].join('|')}
function scoreScenario(s){
  const keys=Object.keys(levels);
  let score=0;
  for(let i=0;i<keys.length;i++){
    for(let j=i+1;j<keys.length;j++){
      const k=pairKey(keys[i],s[keys[i]],keys[j],s[keys[j]]);
      if(!coverage.pairs[k]) score++;
    }
  }
  return score;
}
function markCoverage(s){
  const keys=Object.keys(levels);
  for(let i=0;i<keys.length;i++){
    for(let j=i+1;j<keys.length;j++){
      coverage.pairs[pairKey(keys[i],s[keys[i]],keys[j],s[keys[j]])]=(coverage.pairs[pairKey(keys[i],s[keys[i]],keys[j],s[keys[j]])]||0)+1;
    }
  }
  coverage.usedScenarios.push(s.id);
  if(coverage.usedScenarios.length>200) coverage.usedScenarios.shift();
  save(K.coverage,coverage);
}
function generateScenario(){
  let best=null,bestScore=-1;
  for(let i=0;i<60;i++){
    let s={id:uid()};
    for(const k of Object.keys(levels)) s[k]=rand(levels[k]);
    s=validateScenario(s);
    const sc=scoreScenario(s)+Math.random();
    if(sc>bestScore){best=s;bestScore=sc}
  }
  const tm=timeForBand(best.timeBand);
  const now=new Date();
  best.scenarioDateTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),tm.hour,tm.minute,0).toISOString();
  best.actualCreatedAt=new Date().toISOString();
  markCoverage(best);
  return best;
}
let scenario=load(K.scenario,null)||generateScenario();
save(K.scenario,scenario); save(K.testNo,testNo);

function chips(){
  const el=$('#scenarioChips');el.innerHTML='';
  const vals=[
    scenario.workStatus,
    scenario.timeBand,
    '仕事:'+scenario.workload,
    '次:'+scenario.nextPlan,
    scenario.completed,
    scenario.dayType,
    scenario.testType
  ];
  vals.forEach(v=>{const d=document.createElement('span');d.className='chip';d.textContent=v;el.appendChild(d)});
  $('#testNo').textContent='TEST '+testNo;
}
function classify(text){
  const t=text.trim();
  const found=[];
  const add=(mainTopic,semanticMeaning)=>{
    if(!found.some(x=>x.semanticMeaning===semanticMeaning)) found.push({mainTopic,semanticMeaning});
  };

  // Explicit conversational intent has priority over schedule/work keywords.
  const wantsStopTalk =
    /話しかけなくていい|話さなくていい|話しかけないで|今は.{0,8}(話さなくて|話しかけなくて|静かに)|静かにして|黙ってて|また後で.{0,6}(話|聞)|今はいいよ|今は大丈夫/.test(t);
  const wantsMemory =
    /覚えて(る|ます|いる)?[？?]?|さっき.{0,20}(何て|なんて|何を).{0,12}(言った|話した)|さっき.{0,20}(言った|話した).{0,10}(こと|内容)|前に.{0,20}(話した|言った|って話)|その前.{0,12}(何て|なんて|言った)|もう一つ前|もうひとつ前|さらに前|さっきの話|そのとき.{0,16}そのあと|そのあと.{0,16}(何て|なんて|言った|話した|覚えて)/.test(t);
  const wantsSmalltalk =
    /雑談しよう|雑談しよ|少し.{0,5}(話そう|話しよう|お話ししよう)|ちょっと.{0,5}(話そう|話しよう)|話し相手|雑談したい|楽しい話|何か.{0,8}話題.{0,6}(出して|ちょうだい|出せ)|美月から.{0,12}(話題|話して|何か)|そっちから.{0,10}(話して|話題)|仕事の話.{0,6}(じゃなく|以外)|仕事以外.{0,8}(話|雑談)|普通の雑談/.test(t);
  const wantsAdvice =
    /どうしたら|どうすれば|アドバイス|助言|何を.{0,16}(すれば|したら|確認|気をつけ|基準|決めれば|残す)|何か.{0,12}(気をつけ|した方|すべき)|気をつけた方がいい|確認しておけばいい|確認すればいい|どうした方がいい|どうやって.{0,12}(決め|選)|何を基準|基準に.{0,12}(決め|選)|期限.{0,8}同じ|どっち.{0,12}(先|優先)|何を残す|残すか.{0,12}(決め|選)/.test(t);
  const wantsOpinion = /どう思う|美月.{0,8}どう/.test(t);
  const wantsNothingSpecial = /特に.{0,8}(話すこと|話題).{0,5}ない|話すこと.{0,5}ない|何も.{0,5}(ない|話さない)|特に.{0,5}ないな/.test(t);
  const hasNoSchedule = /特に.{0,6}予定.{0,5}ない|予定.{0,4}(ない|なし)|予定は.{0,4}ない|何も予定.{0,4}ない/.test(t);

  // Relations and progress phrases found in TEST 9-12.
  const endAfterMeeting =
    /(?:この|その)?(?:打合せ|会議)(?:さえ)?(?:が)?終われば.{0,18}(?:帰れ|帰る|終わり|終わる|一区切り)|(?:打合せ|会議)(?:さえ)?(?:が)?終われば|(?:打合せ|会議)が終わったら.{0,18}(?:帰れ|帰る|終わり|一区切り)/.test(t);
  const endAfterOne =
    /(?:あと|残り).{0,8}(?:一つ|1つ|ひとつ|一件|1件).{0,12}(?:やれば|終えれば|片づけば|終われば).{0,12}(?:終わり|終わる|帰れ|帰る|一区切り)/.test(t);
  const remainingOne =
    /(?:残り(?:は|が)?\s*(?:あと)?|あと)\s*(?:一つ|1つ|ひとつ|一件|1件)(?:だけ)?/.test(t);
  const progressPositive =
    /(?:だいぶ|結構|かなり).{0,6}(?:進ん|はかど|捗|片づ|片付|終わ)|(?:はかど|捗)った|順調に.{0,6}進ん/.test(t);
  const restWindow = /(?:打合せ|会議).{0,8}(?:まで|前).{0,10}(?:少し)?時間.{0,6}(?:ある|空いて)|(?:少し)?時間.{0,6}(?:ある|空いて).{0,10}(?:打合せ|会議)/.test(t);
  const restIntent = /(?:10|１０|5|５|15|１５|20|２０)?\s*分.{0,8}休(?:もう|む|みたい)|少し.{0,6}休(?:もう|む|みたい)|休憩(?:しよう|する|したい)|休もうかな/.test(t);

  // Collect multiple meanings instead of stopping at the first match.
  if(/休日出勤|休み.{0,8}(仕事|出勤)|休日.{0,8}(仕事|出勤)/.test(t)) add('work_status','holiday_work');
  if(/仕事.{0,8}(終わった|終わり|おしまい)|退勤|勤務.{0,5}終了/.test(t) && !/一つ|1つ|ひとつ|一件/.test(t)) add('work_status','after_work');
  if(/休み|休日/.test(t) && !found.some(x=>x.semanticMeaning==='holiday_work')) add('work_status','holiday');

  if(endAfterMeeting) add('relation','end_after_meeting');
  if(endAfterOne) add('relation','end_after_one');
  if(remainingOne) add('progress','remaining_one');
  if(progressPositive) add('progress','progress_positive');
  if(restWindow) add('condition','rest_window');
  if(restIntent) add('condition','rest_intent');

  if(!remainingOne && !endAfterOne && /一つ.{0,8}(終わ|片づ|片付|完了)|1つ.{0,8}(終わ|片づ|片付|完了)|ひとつ.{0,8}(終わ|片づ|片付|完了)|一件.{0,8}(終わ|片づ|片付|完了)/.test(t)) add('completion','task_completed_one');
  if(/複数|何件か|だいぶ.{0,5}(片|終わ)|かなり.{0,5}(片|終わ)|いくつか.{0,8}(終わ|片づ|片付|完了)|結構.{0,5}(片づ|片付)/.test(t)) add('completion','task_completed_multiple');
  if(!remainingOne && /まだ.{0,12}残|結構.{0,8}残|かなり.{0,8}残|残って(る|いる)|残りが/.test(t)) add('workload','work_remaining');
  if(/疲れた|疲れたな|くたくた|しんどい/.test(t)) add('condition','user_tired');
  if(/忙しい|仕事.{0,7}(多い|多め|多かった)|仕事も多い|多いんだ|多いな|仕事量.{0,6}多/.test(t)) add('workload','work_heavy');
  if(/暇|仕事.{0,5}(少ない|少なめ|少なかった)|少ないな/.test(t) && !/美月/.test(t)) add('workload','work_light');
  if(/今から.{0,8}(打合せ|会議)|これから.{0,8}(打合せ|会議)|このあと.{0,8}(打合せ|会議)|打合せ|会議/.test(t)) add('schedule','meeting_soon');
  if(/外出|出かけ|移動/.test(t)) add('schedule','outing_soon');
  if(/明日.{0,8}仕事|明日も/.test(t)) add('schedule','work_tomorrow');
  if(/21時|22時|23時|夜遅|こんな時間|もう.{0,5}時/.test(t)) add('time','late_time');
  if(/朝早|まだ朝/.test(t)) add('time','early_time');
  if(/美月.{0,8}暇|暇.{0,8}美月/.test(t)) add('smalltalk','mizuki_idle');
  if(hasNoSchedule) add('schedule','no_schedule');

  if(wantsAdvice) add('question','ask_advice');
  if(wantsOpinion) add('question','ask_mizuki_opinion');
  if(wantsNothingSpecial) add('smalltalk','nothing_special');
  if(wantsSmalltalk) add('smalltalk','smalltalk_request');
  if(wantsMemory) add('memory','memory_request');
  if(wantsStopTalk) add('conversation_control','silence_request');

  // User control / direct requests / explicit relations > scenario interpretation.
  let primary=null;
  const priority=['silence_request','memory_request','smalltalk_request','ask_advice','rest_intent','rest_window','end_after_meeting','end_after_one','remaining_one','progress_positive','nothing_special','ask_mizuki_opinion','no_schedule'];
  for(const p of priority){
    const hit=found.find(x=>x.semanticMeaning===p);
    if(hit){primary=hit;break;}
  }
  if(!primary){
    if(found.some(x=>x.semanticMeaning==='task_completed_one') &&
       found.some(x=>x.semanticMeaning==='work_remaining')){
      primary=found.find(x=>x.semanticMeaning==='task_completed_one');
    }else{
      primary=found[0]||{mainTopic:'unknown',semanticMeaning:'unknown'};
    }
  }

  return {
    mainTopic:primary.mainTopic,
    semanticMeaning:primary.semanticMeaning,
    semanticMeanings:found.map(x=>x.semanticMeaning),
    wantsAdvice,
    wantsNothingSpecial,
    wantsSmalltalk,
    wantsStopTalk,
    wantsMemory,
    hasNoSchedule
  };
}
function recentMizuki(n=8){return history.filter(x=>x.speaker==='mizuki'&&x.mainTopic!=='system').slice(-n)}
function recentUser(n=8){return history.filter(x=>x.speaker==='user').slice(-n)}
function recentQuestions(){return recentMizuki(3).filter(x=>x.intent==='ask').length}
function hasRecentMeaning(key,n=8){return recentMizuki(n).some(x=>x.meaningKey===key)}
function recentUserHasMeaning(key,n=8){return recentUser(n).some(x=>(x.semanticMeanings||[x.semanticMeaning]).includes(key))}
function semanticGroup(value){
  const v=value||'';
  if(['work_heavy','work_remaining','one_done_but_heavy','multiple_done_but_heavy','acknowledge_heavy_work','acknowledge_remaining','heavy_and_late','late_heavy_work'].some(k=>v.includes(k))) return 'workload_high';
  if(['task_completed_one','task_completed_multiple','acknowledge_one_completion','one_completion_observe','acknowledge_multiple_completion','multiple_completion_observe'].some(k=>v.includes(k))) return 'completion';
  if(['progress_positive','progress_positive_ack','progress_positive_outing'].some(k=>v.includes(k))) return 'progress_positive';
  if(['remaining_one','remaining_one_ack','end_after_one','end_after_one_ack'].some(k=>v.includes(k))) return 'remaining_one';
  if(['end_after_meeting','end_after_meeting_ack'].some(k=>v.includes(k))) return 'end_after_meeting';
  if(['memory_request','memory_recall','memory_recall_previous','memory_recall_next','memory_recall_semantic'].some(k=>v.includes(k))) return 'memory_request';
  if(['meeting_soon','acknowledge_meeting','meeting_question','context_next_meeting'].some(k=>v.includes(k))) return 'meeting';
  if(['outing_soon','acknowledge_outing','context_next_outing'].some(k=>v.includes(k))) return 'outing';
  if(['smalltalk_request','smalltalk_accept','smalltalk_topic','smalltalk_no_work','quiet_day','nothing_special_response','mizuki_not_busy','quiet_moment'].some(k=>v.includes(k))) return 'smalltalk';
  if(['silence_request','silence_ack'].some(k=>v.includes(k))) return 'silence';
  if(['rest_window','rest_window_ack','rest_intent','rest_intent_ack','tired_with_meeting'].some(k=>v.includes(k))) return 'care';
  if(['no_schedule','no_schedule_holiday_morning','no_schedule_holiday','no_schedule_general'].some(k=>v.includes(k))) return 'free_time';
  return v;
}
function recentMeaningGroups(n=8){return recentMizuki(n).map(x=>x.semanticGroup||semanticGroup(x.meaningKey||x.semanticMeaning))}
function hasRecentGroup(group,n=8){return recentMeaningGroups(n).includes(group)}
function isMemoryRequestText(text=''){
  return /覚えて(る|ます|いる)?[？?]?|さっき.{0,20}(何て|なんて|何を).{0,12}(言った|話した)|さっき.{0,20}(言った|話した).{0,10}(こと|内容)|前に.{0,20}(話した|言った|って話)|その前.{0,12}(何て|なんて|言った)|もう一つ前|もうひとつ前|さらに前|さっきの話|そのとき.{0,16}そのあと|そのあと.{0,16}(何て|なんて|言った|話した|覚えて)/.test(text);
}
function substantiveUserHistory(){
  // speak() is called after the current user message is appended, so exclude the final user item.
  const users=history.filter(x=>x.speaker==='user');
  const prior=users.slice(0,-1);
  return prior.filter(x=>!isMemoryRequestText(x.text||''));
}
function cleanQuote(text=''){
  return text.trim().replace(/[。！？!?]+$/,'');
}
function saveDialogState(){save(K.dialogState,dialogState)}
function setMemoryCursor(item){dialogState.memoryCursorId=item?.id||null;saveDialogState()}
function cursorIndex(items){return dialogState.memoryCursorId?items.findIndex(x=>x.id===dialogState.memoryCursorId):-1}
function memoryQueryMeanings(info){
  const ignore=new Set(['memory_request','late_time','early_time','meeting_soon','outing_soon','work_tomorrow']);
  return (info?.semanticMeanings||[]).filter(m=>!ignore.has(m));
}
function findMemoryByMeaning(items,info,text=''){
  const meanings=memoryQueryMeanings(info);
  if(meanings.length){
    for(let i=items.length-1;i>=0;i--){
      const ms=items[i].semanticMeanings||[items[i].semanticMeaning];
      if(meanings.some(m=>ms.includes(m))) return items[i];
    }
  }
  // Lightweight keyword fallbacks for explicit remembered topics.
  const tests=[];
  if(/仕事.{0,8}多|忙し/.test(text)) tests.push(/仕事.{0,8}(多|忙)|忙し/);
  if(/残り.{0,8}(一つ|1つ|ひとつ|一件|1件)/.test(text)) tests.push(/残り.{0,8}(一つ|1つ|ひとつ|一件|1件)/);
  if(/片づ|片付|はかど|捗/.test(text)) tests.push(/片づ|片付|はかど|捗/);
  if(/疲れ/.test(text)) tests.push(/疲れ/);
  if(/打合せ|会議/.test(text)) tests.push(/打合せ|会議/);
  for(const rx of tests){
    for(let i=items.length-1;i>=0;i--) if(rx.test(items[i].text||'')) return items[i];
  }
  return null;
}
function memoryReply(text='',info=null){
  const items=substantiveUserHistory();
  if(!items.length) return '確認できる以前の発言はまだありません。';
  let idx=cursorIndex(items);
  let target=null;
  let mode='latest';

  const wantsNext=/そのとき.{0,16}そのあと|そのあと.{0,16}(何て|なんて|言った|話した|覚えて)/.test(text);
  const wantsPrev=/その前|もう一つ前|もうひとつ前|さらに前/.test(text);

  if(wantsNext){
    mode='next';
    if(idx<0) return 'どの発言の続きか、今は特定できません。';
    target=items[idx+1]||null;
  }else if(wantsPrev){
    mode='prev';
    if(idx>=0){
      target=items[idx-1]||null;
    }else{
      const back=/もう一つ前|もうひとつ前|さらに前/.test(text)?2:1;
      target=items[items.length-1-back]||null;
    }
  }else{
    const semanticTarget=findMemoryByMeaning(items,info,text);
    if(semanticTarget){target=semanticTarget;mode='semantic'}
    else target=items[items.length-1];
  }

  if(!target) return mode==='next'?'そのあとに確認できる発言はありません。':'そこまでは確認できません。';
  setMemoryCursor(target);
  const q=cleanQuote(target.text||'');
  if(mode==='next') return `はい。そのあと「${q}」と言っていましたね。`;
  if(mode==='prev') return `その前は「${q}」と言っていましたね。`;
  if(mode==='semantic' && /前に/.test(text)) return `はい。前に「${q}」と話していましたね。`;
  if(/覚えて/.test(text)) return `はい。「${q}」と言っていましたね。`;
  return `「${q}」と言っていましたね。`;
}
function smalltalkTopicReply(text=''){
  if(/仕事の話.{0,8}(じゃなく|以外)|仕事以外|普通の雑談/.test(text)){
    return 'わかりました。じゃあ仕事の話は置いておきましょう。最近、何かハマっているものはありますか？';
  }
  if(/話題.{0,8}(出して|ちょうだい|出せ)|美月から.{0,12}(話題|話して|何か)|そっちから.{0,10}(話して|話題)/.test(text)){
    const topics=[
      'じゃあ一つ。最近、何かハマっているものってありますか？',
      'では一つ。最近聴いてよかった曲ってありますか？',
      'じゃあ、最近ちょっと楽しみにしていることってありますか？'
    ];
    const used=new Set(recentMizuki(8).map(x=>x.text));
    return topics.find(x=>!used.has(x))||topics[Math.floor(Math.random()*topics.length)];
  }
  if(/楽しい話/.test(text)) return 'いいですね。仕事も終わったことですし、少し楽しい話をしましょうか。';
  return (scenario.timeBand==='夜'||scenario.timeBand==='深夜')
    ? 'いいですね。今は少し静かな時間ですし、少しお話ししましょうか。'
    : 'いいですね。少しお話ししましょうか。';
}
function progressPositiveReply(text='',withOuting=false){
  let first='今日はだいぶ進んだんですね。';
  if(/はかど|捗/.test(text)) first='今日は結構はかどったんですね。';
  else if(/片づ|片付/.test(text)) first='いくつか片づいたんですね。';
  else if(/終わ/.test(text)) first='今日はだいぶ片づいたんですね。';
  return withOuting ? `${first}このあとは外出なんですね。` : first;
}

function patternPenalty(pattern){
  const recent=recentMizuki(12);
  const count=recent.filter(x=>x.phrasePattern===pattern).length;
  const neg=evaluations.slice(-60).filter(e=>e.evaluation==='unnatural'&&e.analysis?.phrasePattern===pattern).length;
  return count*1.5+neg*2;
}
function canUseName(){
  const name=settings.callName.trim();
  if(!name) return false;
  const last=recentMizuki(5).some(x=>x.usedName);
  return !last && Math.random()<0.18;
}
function candidate(topic,meaning,intent,pattern,text,expression='normal',base=5,group=null){
  return {topic,meaning,intent,pattern,text,expression,base,meaningKey:meaning,semanticGroup:group||semanticGroup(meaning)};
}

    c.push(candidate('memory',next?'memory_recall_next':(prev?'memory_recall_previous':'memory_recall'),'inform','memory_recall',memoryReply(text,info),'normal',22,'memory_request'));
    return c;

    else if(s.nextPlan==='外出') c.push(candidate('schedule','context_next_outing','inform','observation_only','次は外出の予定ですね。','normal',4,'outing'));
    else if(s.completed==='複数完了') c.push(candidate('completion','context_multiple_done','observe','observation_only','今日はすでにいくつか終わっているんですね。','normal',4,'completion'));
    else if(s.workload==='多い') c.push(candidate('workload','context_heavy','observe','observation_only','今日は仕事量が多めですね。','normal',3,'workload_high'));

    if((s.timeBand==='夕方'||s.timeBand==='夜') && s.dayType==='金曜') c.push(candidate('smalltalk','friday_evening','smalltalk','smalltalk_time','金曜もそろそろ終盤ですね。','normal',3,'smalltalk'));
    if(s.dayType==='日曜' && (s.timeBand==='夕方'||s.timeBand==='夜')) c.push(candidate('smalltalk','sunday_evening','smalltalk','smalltalk_time','もう日曜日の夕方ですね。','normal',3,'smalltalk'));
  }

  return c;
}
function adviceByScenario(s,text=''){
  // Follow-up criteria questions must answer the criterion, not fall back to acknowledgement.
  if(/期限.{0,8}同じ|どっち.{0,12}(先|優先)/.test(text)){
    return '期限が同じなら、重要度が高い方を優先して、重要度も同じなら短時間で一区切りつけられる方から進めるとよさそうです。';
  }
  if(/何を残す|残すか.{0,12}(決め|選)|何を.{0,12}残す/.test(text)){
    return '今日中でなくても問題ないものや、期限・重要度が低いものから残すとよさそうです。';
  }
  if(/何を基準|基準に.{0,12}(決め|選)|どうやって.{0,12}(決め|選)/.test(text)){
    return '期限が近いものか、短時間で一区切りつけられるものを優先するとよさそうです。';
  }
  if(/打合せ|会議/.test(text)||s.nextPlan==='打合せ'){
    if(/何を.{0,12}確認|確認しておけば|確認すれば/.test(text)){
      return '打合せの目的と、確認しておきたいことを一つ整理しておくとよさそうです。';
    }
    return '次が打合せなら、確認したいことを一つだけ整理しておくとよさそうです。';
  }
  if(s.nextPlan==='外出'&&(s.workload==='多い'||/残って/.test(text))){
    return 'このあと外出なら、出る前に優先度の高いものだけ確認して、残りは戻ってからにするのがよさそうです。';
  }
  if((s.timeBand==='夜'||s.timeBand==='深夜')&&s.workload==='多い') return '今夜全部を片づけるより、残すものを決めた方がよさそうです。';
  if(s.workStatus==='休日') return '今日はお休みなので、無理に予定を増やさなくてもよさそうです。';
  return '今の状況なら、次に一つだけ優先するものを決めるのがよさそうです。';
}
function opinionByScenario(s){
  if(s.workload==='多い') return '今日は仕事量が多いので、全部を同じ重さで扱わない方がよさそうです。';
  if(s.workStatus==='休日出勤') return '休日出勤なので、普段の勤務日と同じ詰め方にしなくてもよさそうです。';
  return '今のところ、無理に変える必要がある状況には見えません。';
}
function chooseCandidate(list){
  let scored=list.map(x=>{
    let score=x.base-patternPenalty(x.pattern);
    let rejected=false, reason=[];
    if(hasRecentMeaning(x.meaningKey,8)){score-=8;rejected=true;reason.push('recentMeaning')}
    if(x.semanticGroup && hasRecentGroup(x.semanticGroup,4)){
      score-=4.5; reason.push('recentSemanticGroup');
    }
    if(recentMizuki(3).some(r=>r.mainTopic===x.topic)){score-=1.8;reason.push('recentTopic')}
    if(x.intent==='ask'&&recentQuestions()>0){score-=7;reason.push('recentQuestion')}
    if(x.intent==='advise'&&scenario.testType!=='advice'){score-=1.5;reason.push('adviceLowPriority')}
    score+=Math.random()*1.5;
    return {...x,score,rejected,reason};
  }).sort((a,b)=>b.score-a.score);
  return {selected:scored[0],all:scored};
}
function maybeName(text,intent){
  const use=canUseName() && ['care','advise','ask'].includes(intent);
  return {text:use?(settings.callName.trim()+'、'+text):text,usedName:use};
}
function speak(userText){
  const parsed=classify(userText);
  const list=candidatesFor(parsed,userText);
  const choice=chooseCandidate(list);
  const named=maybeName(choice.selected.text,choice.selected.intent);
  const debug={
    OBSERVE:{userText,scenario},
    INTERPRET:parsed,
    CANDIDATES:choice.all.map(x=>({meaningKey:x.meaningKey,semanticGroup:x.semanticGroup,intent:x.intent,score:+x.score.toFixed(2),reasons:x.reason})),
    SELECTED:choice.selected.meaningKey,
    INTENT:choice.selected.intent,
    RECENT:recentMizuki(6).map(x=>x.meaningKey),
    RECENT_GROUPS:recentMeaningGroups(6),
    REPETITION_REJECTED:choice.all.filter(x=>x.rejected).map(x=>x.meaningKey),
    EXPRESSION:choice.selected.expression,
    USED_NAME:named.usedName
  };
  return {
    id:uid(),timestamp:new Date().toISOString(),speaker:'mizuki',text:named.text,
    scenarioId:scenario.id,scenarioSnapshot:{...scenario},mainTopic:choice.selected.topic,
    semanticMeaning:parsed.semanticMeaning,semanticMeanings:parsed.semanticMeanings,
    meaningKey:choice.selected.meaningKey,semanticGroup:choice.selected.semanticGroup,
    intent:choice.selected.intent,expression:choice.selected.expression,
    phrasePattern:choice.selected.pattern,usedName:named.usedName,debug
  };
}
function addUser(text){
  const p=classify(text);
  if(p.semanticMeaning!=='memory_request') dialogState.memoryCursorId=null;
  if(p.semanticMeaning==='smalltalk_request' && /仕事の話.{0,8}(じゃなく|以外)|仕事以外|普通の雑談/.test(text)) dialogState.suppressWork=true;
  else if(p.semanticMeaning!=='smalltalk_request' && /(仕事|業務|打合せ|会議|外出|予定)/.test(text)) dialogState.suppressWork=false;
  saveDialogState();
  const item={
    id:uid(),timestamp:new Date().toISOString(),speaker:'user',text,
    scenarioId:scenario.id,scenarioSnapshot:{...scenario},
    mainTopic:p.mainTopic,semanticMeaning:p.semanticMeaning,
    semanticMeanings:p.semanticMeanings,semanticGroup:semanticGroup(p.semanticMeaning),intent:'user'
  };
  history.push(item);
  save(K.history,history);
  return item;
}
function renderMessage(m){
  const wrap=document.createElement('div');
  wrap.dataset.id=m.id;
  const row=document.createElement('div');
  row.className='row '+(m.speaker==='user'?'user':'mizuki');
  if(m.speaker==='mizuki'&&m.mainTopic!=='system'){
    const av=document.createElement('div');av.className='avatar';av.style.width='24px';av.style.height='24px';av.style.fontSize='10px';av.textContent='美';row.appendChild(av);
  }
  const b=document.createElement('div');b.className='bubble';b.textContent=m.text;row.appendChild(b);wrap.appendChild(row);

  if(m.speaker==='mizuki'&&m.mainTopic!=='system'){
    const ev=document.createElement('div');ev.className='eval';
    const nat=document.createElement('button');nat.textContent='自然';nat.className='natural';
    const unn=document.createElement('button');unn.textContent='不自然';unn.className='unnatural';
    const existing=evaluations.find(e=>e.mizukiMessageId===m.id);
    if(existing){
      (existing.evaluation==='natural'?nat:unn).classList.add('selected');
    }
    ev.append(nat,unn);wrap.appendChild(ev);

    const improve=document.createElement('div');improve.className='improve'+(existing?.evaluation==='unnatural'?' show':'');
    const ta=document.createElement('textarea');ta.placeholder='自分ならこう言う（任意）';ta.value=existing?.improvedText||'';
    const acts=document.createElement('div');acts.className='improve-actions';
    const sb=document.createElement('button');sb.className='smallbtn';sb.textContent='改善例を保存';acts.appendChild(sb);
    improve.append(ta,acts);wrap.appendChild(improve);

    function setEval(type){
      let e=evaluations.find(x=>x.mizukiMessageId===m.id);
      const userMsg=[...history].reverse().find(x=>x.speaker==='user'&&x.timestamp<=m.timestamp&&x.scenarioId===m.scenarioId);
      if(!e){
        e={id:uid(),mizukiMessageId:m.id,scenarioId:m.scenarioId,timestamp:new Date().toISOString()};
        evaluations.push(e);
      }
      e.evaluation=type;e.improvedText=ta.value.trim()||null;
      e.scenario=m.scenarioSnapshot?{...m.scenarioSnapshot}:{...scenario};
      e.userText=userMsg?.text||null;e.mizukiText=m.text;
      e.analysis={mainTopic:m.mainTopic,semanticMeaning:m.semanticMeaning,semanticMeanings:m.semanticMeanings||[m.semanticMeaning],meaningKey:m.meaningKey,semanticGroup:m.semanticGroup||semanticGroup(m.meaningKey),intent:m.intent,phrasePattern:m.phrasePattern,expression:m.expression,usedName:m.usedName};
      e.logicVersion=VERSION;
      save(K.evals,evaluations);
      nat.classList.toggle('selected',type==='natural');
      unn.classList.toggle('selected',type==='unnatural');
      improve.classList.toggle('show',type==='unnatural');
    }
    nat.onclick=()=>setEval('natural');
    unn.onclick=()=>setEval('unnatural');
    sb.onclick=()=>{setEval('unnatural');alert('改善例を保存しました。')};

    const th=document.createElement('div');th.className='thinking'+(settings.debug?' show':'');
    if(m.debug){
      const det=document.createElement('details');
      const sum=document.createElement('summary');sum.textContent='Thinking';
      const pre=document.createElement('pre');pre.textContent=JSON.stringify(m.debug,null,2);
      det.append(sum,pre);th.appendChild(det);
    }
    wrap.appendChild(th);
  }
  return wrap;
}
function renderHistory(){
  const chat=$('#chat');chat.innerHTML='';
  if(!history.length){const e=document.createElement('div');e.className='empty';e.textContent='この状況を見て、美月に自由に話しかけてください。';chat.appendChild(e)}
  else history.forEach(m=>chat.appendChild(renderMessage(m)));
  requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight);
}
function updateExpression(exp='normal'){
  $('#expressionLabel').textContent=exp;
  $('#avatar').textContent=({normal:'美',smile:'☺',care:'美',serious:'美'})[exp]||'美';
}
function send(){
  const input=$('#input');const text=input.value.trim();if(!text)return;
  addUser(text);input.value='';resizeInput();
  const reply=speak(text);history.push(reply);save(K.history,history);
  longMemory.push({timestamp:reply.timestamp,meaningKey:reply.meaningKey,phrasePattern:reply.phrasePattern,intent:reply.intent,evaluation:null});
  if(longMemory.length>300)longMemory=longMemory.slice(-300);
  save(K.longMemory,longMemory);
  updateExpression(reply.expression);renderHistory();
}
function nextScenario(){
  dialogState.memoryCursorId=null;dialogState.suppressWork=false;saveDialogState();
  if(!confirm('次のテストへ進みますか？\\n現在の会話履歴は残したまま、想定状況だけ変更します。'))return;
  scenario=generateScenario();testNo++;save(K.scenario,scenario);save(K.testNo,testNo);chips();
  const divider={id:uid(),timestamp:new Date().toISOString(),speaker:'system',text:'── 想定状況を変更しました ──',scenarioId:scenario.id,scenarioSnapshot:{...scenario},mainTopic:'system',semanticMeaning:'scenario_changed',semanticMeanings:['scenario_changed'],meaningKey:'scenario_changed_'+scenario.id,intent:'inform',expression:'normal',phrasePattern:'system',usedName:false};
  history.push(divider);save(K.history,history);renderHistory();
}
function resizeInput(){
  const el=$('#input');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,112)+'px';
}
function exportJSON(){
  const data={
    app:'Mizuki Conversation Lab',version:VERSION,exportedAt:new Date().toISOString(),
    settings:{callName:settings.callName||null},
    currentScenario:scenario,testNo,
    evaluations,
    conversationHistory:history,
    longMemory,
    coverageSummary:{pairCount:Object.keys(coverage.pairs).length,scenarioCount:coverage.usedScenarios.length}
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='mizuki_conversation_lab_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearType(type){
  const msgs={
    chat:'会話履歴をすべて削除しますか？',
    memory:'Memoryをすべて削除しますか？',
    evaluations:'評価データをすべて削除しますか？'
  };
  if(!confirm(msgs[type]))return;
  if(type==='chat'){history=[];dialogState.memoryCursorId=null;dialogState.suppressWork=false;saveDialogState();save(K.history,history);renderHistory()}
  if(type==='memory'){longMemory=[];coverage={pairs:{},usedScenarios:[]};save(K.longMemory,longMemory);save(K.coverage,coverage)}
  if(type==='evaluations'){evaluations=[];save(K.evals,evaluations);renderHistory()}
}
function manualScenario(){
  const labels=['勤務状態','時間帯','仕事量','次予定','完了','曜日系','テストタイプ'];
  const keys=['workStatus','timeBand','workload','nextPlan','completed','dayType','testType'];
  for(let i=0;i<keys.length;i++){
    const arr=levels[keys[i]];
    const ans=prompt(labels[i]+'\\n'+arr.map((x,n)=>(n+1)+': '+x).join('\\n')+'\\n番号を入力',String(Math.max(1,arr.indexOf(scenario[keys[i]])+1)));
    if(ans===null) return;
    const n=Number(ans)-1;if(arr[n])scenario[keys[i]]=arr[n];
  }
  scenario=validateScenario(scenario);scenario.id=uid();scenario.actualCreatedAt=new Date().toISOString();
  save(K.scenario,scenario);chips();alert('想定状況を変更しました。');
}

$('#sendBtn').onclick=send;
$('#input').addEventListener('input',resizeInput);
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#nextTestBtn').onclick=nextScenario;
$('#settingsBtn').onclick=()=>{$('#settingsOverlay').classList.add('show')};
$('#closeSettings').onclick=()=>{
  settings.callName=$('#callName').value.trim();
  settings.debug=$('#debugToggle').checked;save(K.settings,settings);
  $('#settingsOverlay').classList.remove('show');renderHistory();
};
$('#settingsOverlay').addEventListener('click',e=>{if(e.target===$('#settingsOverlay'))$('#closeSettings').click()});
$('#exportBtn').onclick=exportJSON;
$('#manualScenarioBtn').onclick=manualScenario;
document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearType(b.dataset.clear));
$('#callName').value=settings.callName||'';
$('#debugToggle').checked=!!settings.debug;

chips();renderHistory();
const last=[...history].reverse().find(x=>x.speaker==='mizuki');if(last)updateExpression(last.expression);
})();
</script>
