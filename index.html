<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mizuki Conversation Lab v0.1.2</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--text:#17181b;--sub:#6f737b;--line:#e6e8ec;
  --accent:#4b79ff;--accent2:#eef3ff;--user:#4b79ff;--mizuki:#fff;
  --ok:#1c8b55;--ng:#c84a4a;--shadow:0 10px 30px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
.app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
.header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:relative;z-index:10}
.headrow{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#e8eeff,#fff);display:grid;place-items:center;font-weight:700;box-shadow:inset 0 0 0 1px #dfe6ff}
.identity{min-width:0;flex:1}
.name{font-size:17px;font-weight:700;line-height:1.2}
.meta{font-size:12px;color:var(--sub);margin-top:2px}
.iconbtn{border:0;background:#f1f2f5;border-radius:12px;width:42px;height:42px;font-size:19px}
.scenario{margin:10px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.035)}
.scenario-top{display:flex;align-items:center;gap:8px}
.testno{font-weight:800;font-size:13px;letter-spacing:.04em}
.spacer{flex:1}
.nextbtn{border:0;background:var(--accent2);color:#315cd6;border-radius:10px;padding:8px 11px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:#f4f5f7;border:1px solid #e9eaed;border-radius:999px;padding:5px 8px;color:#4d5159}
.chat{flex:1;overflow-y:auto;padding:14px 12px 18px;scroll-behavior:smooth}
.row{display:flex;margin:9px 0;align-items:flex-end;gap:7px}
.row.user{justify-content:flex-end}
.bubble{max-width:84%;padding:10px 12px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
.mizuki .bubble{background:var(--mizuki);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.035)}
.user .bubble{background:var(--user);color:white;border-bottom-right-radius:6px}
.eval{display:flex;gap:7px;margin:5px 0 0 31px;align-items:center;flex-wrap:wrap}
.eval button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;color:#555}
.eval button.selected.natural{border-color:#b9dfcc;color:var(--ok);background:#f0faf5}
.eval button.selected.unnatural{border-color:#efc2c2;color:var(--ng);background:#fff4f4}
.improve{margin:7px 0 0 31px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;display:none}
.improve.show{display:block}
.improve textarea{width:100%;min-height:64px;resize:vertical;border:1px solid #dfe2e8;border-radius:10px;padding:9px;outline:none}
.improve-actions{display:flex;justify-content:flex-end;margin-top:7px}
.smallbtn{border:0;background:#edf1ff;color:#345fd8;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
.thinking{margin:6px 0 0 31px;display:none}
.thinking.show{display:block}
.thinking details{font-size:11px;color:#666;background:#f0f1f4;border-radius:10px;padding:7px 9px}
.thinking pre{white-space:pre-wrap;margin:7px 0 0;font-size:10px;line-height:1.45}
.composer{background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:43px;max-height:112px;resize:none;border:1px solid #dfe2e8;border-radius:15px;padding:11px 12px;outline:none;background:#fff;line-height:1.35}
.send{border:0;background:var(--accent);color:white;border-radius:14px;min-width:62px;height:43px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(12,15,20,.28);display:none;align-items:flex-end;z-index:30}
.overlay.show{display:flex}
.sheet{width:min(100%,520px);margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:82dvh;overflow:auto;box-shadow:var(--shadow)}
.sheet h2{font-size:18px;margin:0 0 14px}
.setting{padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}
.setting input[type=text]{width:100%;border:1px solid #dfe2e8;border-radius:11px;padding:10px}
.switchline{display:flex;align-items:center;justify-content:space-between;gap:14px}
.action{width:100%;border:0;border-radius:12px;padding:11px 12px;text-align:left;background:#f4f5f7;margin:5px 0}
.action.danger{color:#b23d3d;background:#fff2f2}
.close{width:100%;border:0;border-radius:13px;padding:12px;background:#202227;color:#fff;font-weight:800;margin-top:12px}
.notice{font-size:11px;color:var(--sub);line-height:1.5}
.empty{color:#868a92;text-align:center;font-size:13px;margin-top:40px}
.version{font-size:11px;color:#8a8e96;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="headrow">
      <div class="avatar" id="avatar">美</div>
      <div class="identity">
        <div class="name">橘 美月</div>
        <div class="meta"><span id="expressionLabel">normal</span> · Mizuki Conversation Lab</div>
      </div>
      <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙︎</button>
    </div>
  </header>

  <section class="scenario">
    <div class="scenario-top">
      <div class="testno" id="testNo">TEST 1</div>
      <div class="spacer"></div>
      <button class="nextbtn" id="nextTestBtn">次のテスト</button>
    </div>
    <div class="chips" id="scenarioChips"></div>
  </section>

  <main class="chat" id="chat">
    <div class="empty" id="empty">この状況を見て、美月に自由に話しかけてください。</div>
  </main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="美月に話しかける…"></textarea>
    <button class="send" id="sendBtn">送信</button>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>設定</h2>
    <div class="setting">
      <label for="callName">美月からの呼ばれ方</label>
      <input id="callName" type="text" maxlength="20" placeholder="例：シゲキさん、鈴木さん">
      <div class="notice">空欄なら呼び名を使いません。入力内容はこの端末内に保存されます。</div>
    </div>
    <div class="setting switchline">
      <div>
        <b style="font-size:13px">開発モード</b>
        <div class="notice">美月の判断過程を表示します。</div>
      </div>
      <input id="debugToggle" type="checkbox" style="width:24px;height:24px">
    </div>
    <div class="setting">
      <button class="action" id="exportBtn">評価データをJSON出力</button>
      <button class="action" id="manualScenarioBtn">現在の想定状況を変更</button>
    </div>
    <div class="setting">
      <button class="action danger" data-clear="chat">会話履歴をクリア</button>
      <button class="action danger" data-clear="memory">Memoryをクリア</button>
      <button class="action danger" data-clear="evaluations">評価データをクリア</button>
    </div>
    <button class="close" id="closeSettings">閉じる</button>
    <div class="version">Mizuki Conversation Lab v0.1.2 single HTML</div>
  </div>
</div>

<script>
(() => {
'use strict';

const VERSION='0.1.2-single';
const K={
  settings:'mcl_settings_v012',
  history:'mcl_history_v012',
  evals:'mcl_evals_v012',
  longMemory:'mcl_long_memory_v012',
  scenario:'mcl_scenario_v012',
  testNo:'mcl_test_no_v012',
  coverage:'mcl_coverage_v012'
};
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let settings=load(K.settings,{callName:'',debug:false});
let history=load(K.history,[]);
let evaluations=load(K.evals,[]);
let longMemory=load(K.longMemory,[]);
let coverage=load(K.coverage,{pairs:{},usedScenarios:[]});
let testNo=load(K.testNo,1);

const levels={
  workStatus:['通常勤務','休日','休日出勤','勤務終了後'],
  timeBand:['朝','昼','夕方','夜','深夜'],
  workload:['普通','多い','少ない'],
  nextPlan:['なし','通常業務','打合せ','外出'],
  completed:['なし','1件完了','複数完了'],
  dayType:['平日','金曜','土曜','日曜'],
  testType:['basic','contextCombination','memory','repetition','care','advice','smalltalk','silence']
};

function rand(a){return a[Math.floor(Math.random()*a.length)]}
function timeForBand(b){
  const hour=({朝:8,昼:12,夕方:17,夜:21,深夜:0})[b];
  const minute=[0,10,15,20,30,40,45,50][Math.floor(Math.random()*8)];
  return {hour,minute};
}
function validateScenario(s){
  if(s.workStatus==='休日'){
    s.workload='少ない'; s.nextPlan='なし'; s.completed='なし';
  }
  if(s.workStatus==='勤務終了後'){
    s.nextPlan='なし';
    if(s.timeBand==='朝'||s.timeBand==='昼') s.timeBand=rand(['夕方','夜','深夜']);
  }
  if(s.dayType==='日曜' && s.workStatus==='通常勤務') s.workStatus=Math.random()<.5?'休日':'休日出勤';
  if(s.workStatus==='休日出勤' && s.workload==='少ない' && s.completed==='なし' && Math.random()<.5) s.workload='普通';
  return s;
}
function pairKey(a,av,b,bv){return [a,av,b,bv].join('|')}
function scoreScenario(s){
  const keys=Object.keys(levels);
  let score=0;
  for(let i=0;i<keys.length;i++){
    for(let j=i+1;j<keys.length;j++){
      const k=pairKey(keys[i],s[keys[i]],keys[j],s[keys[j]]);
      if(!coverage.pairs[k]) score++;
    }
  }
  return score;
}
function markCoverage(s){
  const keys=Object.keys(levels);
  for(let i=0;i<keys.length;i++){
    for(let j=i+1;j<keys.length;j++){
      coverage.pairs[pairKey(keys[i],s[keys[i]],keys[j],s[keys[j]])]=(coverage.pairs[pairKey(keys[i],s[keys[i]],keys[j],s[keys[j]])]||0)+1;
    }
  }
  coverage.usedScenarios.push(s.id);
  if(coverage.usedScenarios.length>200) coverage.usedScenarios.shift();
  save(K.coverage,coverage);
}
function generateScenario(){
  let best=null,bestScore=-1;
  for(let i=0;i<60;i++){
    let s={id:uid()};
    for(const k of Object.keys(levels)) s[k]=rand(levels[k]);
    s=validateScenario(s);
    const sc=scoreScenario(s)+Math.random();
    if(sc>bestScore){best=s;bestScore=sc}
  }
  const tm=timeForBand(best.timeBand);
  const now=new Date();
  best.scenarioDateTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),tm.hour,tm.minute,0).toISOString();
  best.actualCreatedAt=new Date().toISOString();
  markCoverage(best);
  return best;
}
let scenario=load(K.scenario,null)||generateScenario();
save(K.scenario,scenario); save(K.testNo,testNo);

function chips(){
  const el=$('#scenarioChips');el.innerHTML='';
  const vals=[
    scenario.workStatus,
    scenario.timeBand,
    '仕事:'+scenario.workload,
    '次:'+scenario.nextPlan,
    scenario.completed,
    scenario.dayType,
    scenario.testType
  ];
  vals.forEach(v=>{const d=document.createElement('span');d.className='chip';d.textContent=v;el.appendChild(d)});
  $('#testNo').textContent='TEST '+testNo;
}
function classify(text){
  const t=text.trim();
  let mainTopic='unknown', semanticMeaning='unknown';
  if(/休日出勤|休み.*仕事|休み.*出勤/.test(t)){mainTopic='work_status';semanticMeaning='holiday_work'}
  else if(/仕事.*終わった|退勤|勤務.*終了/.test(t) && !/一つ|1つ|ひとつ/.test(t)){mainTopic='work_status';semanticMeaning='after_work'}
  else if(/休み|休日/.test(t)){mainTopic='work_status';semanticMeaning='holiday'}
  else if(/一つ.*終わ|1つ.*終わ|ひとつ.*終わ|一件.*終わ|一件.*完了/.test(t)){mainTopic='completion';semanticMeaning='task_completed_one'}
  else if(/複数|何件か|だいぶ.*片|かなり.*片/.test(t)){mainTopic='completion';semanticMeaning='task_completed_multiple'}
  else if(/疲れた|疲れたな|くたくた/.test(t)){mainTopic='condition';semanticMeaning='user_tired'}
  else if(/忙しい|仕事.*多|多いな/.test(t)){mainTopic='workload';semanticMeaning='work_heavy'}
  else if(/暇|仕事.*少|少ない/.test(t) && !/美月/.test(t)){mainTopic='workload';semanticMeaning='work_light'}
  else if(/今から.*打|これから.*打|打合せ|会議/.test(t)){mainTopic='schedule';semanticMeaning='meeting_soon'}
  else if(/外出|出かけ|移動/.test(t)){mainTopic='schedule';semanticMeaning='outing_soon'}
  else if(/明日.*仕事|明日も/.test(t)){mainTopic='schedule';semanticMeaning='work_tomorrow'}
  else if(/21時|22時|23時|夜遅|こんな時間|もう.*時/.test(t)){mainTopic='time';semanticMeaning='late_time'}
  else if(/朝早|まだ朝/.test(t)){mainTopic='time';semanticMeaning='early_time'}
  else if(/美月.*暇|暇.*美月/.test(t)){mainTopic='smalltalk';semanticMeaning='mizuki_idle'}
  else if(/どうしたら|どうすれば|アドバイス|助言/.test(t)){mainTopic='question';semanticMeaning='ask_advice'}
  else if(/どう思う|美月.*どう/.test(t)){mainTopic='question';semanticMeaning='ask_mizuki_opinion'}
  else if(/特に.*ない|話すこと.*ない|何もない/.test(t)){mainTopic='smalltalk';semanticMeaning='nothing_special'}
  return {mainTopic,semanticMeaning};
}
function recentMizuki(n=8){return history.filter(x=>x.speaker==='mizuki').slice(-n)}
function recentQuestions(){return recentMizuki(3).filter(x=>x.intent==='ask').length}
function hasRecentMeaning(key,n=8){return recentMizuki(n).some(x=>x.meaningKey===key)}
function patternPenalty(pattern){
  const recent=recentMizuki(12);
  const count=recent.filter(x=>x.phrasePattern===pattern).length;
  const neg=evaluations.slice(-60).filter(e=>e.evaluation==='unnatural'&&e.analysis?.phrasePattern===pattern).length;
  return count*1.5+neg*2;
}
function canUseName(){
  const name=settings.callName.trim();
  if(!name) return false;
  const last=recentMizuki(5).some(x=>x.usedName);
  return !last && Math.random()<0.18;
}
function candidate(topic,meaning,intent,pattern,text,expression='normal',base=5){
  return {topic,meaning,intent,pattern,text,expression,base,meaningKey:meaning};
}
function candidatesFor(info,text){
  const c=[];
  const s=scenario;
  switch(info.semanticMeaning){
    case 'holiday_work':
      c.push(candidate('work_status','acknowledge_holiday_work','care','observation_plus_care','今日は本来お休みの日なんですね。お疲れさまです。','care',9));
      c.push(candidate('work_status','holiday_work_observation','observe','observation_only','今日はお休みの日に仕事なんですね。','normal',7));
      break;
    case 'after_work':
      c.push(candidate('work_status','acknowledge_after_work','react','reaction_short','仕事はここまでなんですね。','normal',9));
      if(s.timeBand==='夜'||s.timeBand==='深夜') c.push(candidate('time','after_work_late','care','observation_plus_care','今日は遅い時間までになりましたね。','care',8));
      break;
    case 'task_completed_one':
      c.push(candidate('completion','acknowledge_one_completion','react','reaction_short','一つ片づいたんですね。','normal',10));
      c.push(candidate('completion','one_completion_observe','observe','observation_only','まず一件、終わったんですね。','normal',8));
      break;
    case 'task_completed_multiple':
      c.push(candidate('completion','acknowledge_multiple_completion','react','reaction_short','いくつか片づいたんですね。','smile',9));
      c.push(candidate('completion','multiple_completion_observe','observe','observation_only','今日はだいぶ進んだようですね。','normal',7));
      break;
    case 'user_tired':
      c.push(candidate('condition','acknowledge_tired','care','reaction_short','疲れたんですね。少し長い一日でしたか。','care',9));
      c.push(candidate('condition','tired_short','care','reaction_short','お疲れさまです。今は少し休めそうですか。','care',7));
      break;
    case 'work_heavy':
      c.push(candidate('workload','acknowledge_heavy_work','observe','observation_only','今日は仕事が多いんですね。','normal',8));
      if((s.timeBand==='夜'||s.timeBand==='深夜') && s.workStatus!=='休日') c.push(candidate('workload','heavy_and_late','care','observation_plus_care','仕事が多いまま、もう遅い時間なんですね。','care',9));
      break;
    case 'work_light':
      c.push(candidate('workload','acknowledge_light_work','observe','observation_only','今日は少し余裕があるんですね。','normal',8));
      break;
    case 'meeting_soon':
      c.push(candidate('schedule','acknowledge_meeting','react','reaction_short','これから打合せなんですね。','normal',8));
      if(recentQuestions()===0)c.push(candidate('schedule','meeting_question','ask','question_followup','その打合せ、長くなりそうですか。','normal',6));
      break;
    case 'outing_soon':
      c.push(candidate('schedule','acknowledge_outing','react','reaction_short','これから外出なんですね。','normal',8));
      break;
    case 'work_tomorrow':
      c.push(candidate('schedule','tomorrow_work_care','care','observation_plus_advice','明日も仕事なんですね。今日はあまり遅くまで詰め込まない方がよさそうです。','care',8));
      c.push(candidate('schedule','tomorrow_work_observe','observe','observation_only','明日も仕事なんですね。','normal',7));
      break;
    case 'late_time':
      if(s.workStatus==='休日出勤') c.push(candidate('time','holiday_work_late','care','observation_plus_care','休日出勤で、もうこんな時間なんですね。今日は長い一日になっていますね。','care',10));
      c.push(candidate('time','late_time_observe','observe','observation_only','もう遅い時間ですね。','normal',7));
      if(s.workload==='多い') c.push(candidate('workload','late_heavy_work','care','observation_plus_care','仕事が多いまま、この時間まで来たんですね。','care',8));
      break;
    case 'early_time':
      c.push(candidate('time','early_time_observe','observe','observation_only','まだ朝早いですね。','normal',8));
      break;
    case 'mizuki_idle':
      c.push(candidate('smalltalk','mizuki_not_busy','smalltalk','smalltalk_short','今のところ、特に急いでお伝えすることはなさそうですね。','smile',10));
      c.push(candidate('smalltalk','quiet_moment','smalltalk','smalltalk_short','今は少し静かな時間ですね。','normal',8));
      break;
    case 'ask_advice':
      c.push(candidate('question','direct_advice','advise','observation_plus_advice', adviceByScenario(s),'serious',10));
      break;
    case 'ask_mizuki_opinion':
      c.push(candidate('question','mizuki_opinion','react','reaction_short', opinionByScenario(s),'normal',9));
      break;
    case 'nothing_special':
      c.push(candidate('smalltalk','nothing_special_response','smalltalk','smalltalk_short','今のところ、大きな変化はなさそうですね。','normal',9));
      c.push(candidate('smalltalk','quiet_day','smalltalk','smalltalk_short','今日は少し静かですね。','normal',8));
      break;
    default:
      c.push(candidate('smalltalk','unknown_safe','react','reaction_short','そうなんですね。','normal',5));
      if(recentQuestions()===0)c.push(candidate('smalltalk','unknown_followup','ask','question_followup','もう少し聞かせてもらえますか。','normal',4));
  }

  // Context alternatives prevent semantic repetition.
  if(s.nextPlan==='打合せ') c.push(candidate('schedule','context_next_meeting','inform','observation_only','次は打合せの予定ですね。','normal',5));
  if(s.nextPlan==='外出') c.push(candidate('schedule','context_next_outing','inform','observation_only','次は外出の予定ですね。','normal',5));
  if(s.completed==='複数完了') c.push(candidate('completion','context_multiple_done','observe','observation_only','今日はすでにいくつか終わっているんですね。','normal',5));
  if(s.workload==='多い') c.push(candidate('workload','context_heavy','observe','observation_only','今日は仕事量が多めですね。','normal',4));
  if((s.timeBand==='夕方'||s.timeBand==='夜') && s.dayType==='金曜') c.push(candidate('smalltalk','friday_evening','smalltalk','smalltalk_time','金曜もそろそろ終盤ですね。','normal',4));
  if(s.dayType==='日曜' && (s.timeBand==='夕方'||s.timeBand==='夜')) c.push(candidate('smalltalk','sunday_evening','smalltalk','smalltalk_time','もう日曜日の夕方ですね。','normal',4));

  return c;
}
function adviceByScenario(s){
  if((s.timeBand==='夜'||s.timeBand==='深夜')&&s.workload==='多い') return '今夜全部を片づけるより、残すものを決めた方がよさそうです。';
  if(s.nextPlan==='打合せ') return '次が打合せなら、その前に確認することを一つだけ決めておくと動きやすそうです。';
  if(s.workStatus==='休日') return '今日はお休みなので、無理に予定を増やさなくてもよさそうです。';
  return '今の状況なら、次に一つだけ優先するものを決めるのがよさそうです。';
}
function opinionByScenario(s){
  if(s.workload==='多い') return '今日は仕事量が多いので、全部を同じ重さで扱わない方がよさそうです。';
  if(s.workStatus==='休日出勤') return '休日出勤なので、普段の勤務日と同じ詰め方にしなくてもよさそうです。';
  return '今のところ、無理に変える必要がある状況には見えません。';
}
function chooseCandidate(list){
  let scored=list.map(x=>{
    let score=x.base-patternPenalty(x.pattern);
    let rejected=false, reason=[];
    if(hasRecentMeaning(x.meaningKey,8)){score-=8;rejected=true;reason.push('recentMeaning')}
    if(recentMizuki(3).some(r=>r.mainTopic===x.topic)){score-=1.8;reason.push('recentTopic')}
    if(x.intent==='ask'&&recentQuestions()>0){score-=7;reason.push('recentQuestion')}
    if(x.intent==='advise'&&scenario.testType!=='advice'){score-=1.5;reason.push('adviceLowPriority')}
    score+=Math.random()*1.5;
    return {...x,score,rejected,reason};
  }).sort((a,b)=>b.score-a.score);
  return {selected:scored[0],all:scored};
}
function maybeName(text,intent){
  const use=canUseName() && ['care','advise','ask'].includes(intent);
  return {text:use?(settings.callName.trim()+'、'+text):text,usedName:use};
}
function speak(userText){
  const parsed=classify(userText);
  const list=candidatesFor(parsed,userText);
  const choice=chooseCandidate(list);
  const named=maybeName(choice.selected.text,choice.selected.intent);
  const debug={
    OBSERVE:{userText,scenario},
    INTERPRET:parsed,
    CANDIDATES:choice.all.map(x=>({meaningKey:x.meaningKey,intent:x.intent,score:+x.score.toFixed(2),reasons:x.reason})),
    SELECTED:choice.selected.meaningKey,
    INTENT:choice.selected.intent,
    RECENT:recentMizuki(6).map(x=>x.meaningKey),
    REPETITION_REJECTED:choice.all.filter(x=>x.rejected).map(x=>x.meaningKey),
    EXPRESSION:choice.selected.expression,
    USED_NAME:named.usedName
  };
  return {
    id:uid(),timestamp:new Date().toISOString(),speaker:'mizuki',text:named.text,
    scenarioId:scenario.id,mainTopic:choice.selected.topic,
    semanticMeaning:parsed.semanticMeaning,meaningKey:choice.selected.meaningKey,
    intent:choice.selected.intent,expression:choice.selected.expression,
    phrasePattern:choice.selected.pattern,usedName:named.usedName,debug
  };
}
function addUser(text){
  const p=classify(text);
  const item={id:uid(),timestamp:new Date().toISOString(),speaker:'user',text,scenarioId:scenario.id,mainTopic:p.mainTopic,semanticMeaning:p.semanticMeaning,intent:'user'};
  history.push(item);
  save(K.history,history);
  return item;
}
function renderMessage(m){
  const wrap=document.createElement('div');
  wrap.dataset.id=m.id;
  const row=document.createElement('div');
  row.className='row '+(m.speaker==='user'?'user':'mizuki');
  if(m.speaker==='mizuki'){
    const av=document.createElement('div');av.className='avatar';av.style.width='24px';av.style.height='24px';av.style.fontSize='10px';av.textContent='美';row.appendChild(av);
  }
  const b=document.createElement('div');b.className='bubble';b.textContent=m.text;row.appendChild(b);wrap.appendChild(row);

  if(m.speaker==='mizuki'){
    const ev=document.createElement('div');ev.className='eval';
    const nat=document.createElement('button');nat.textContent='自然';nat.className='natural';
    const unn=document.createElement('button');unn.textContent='不自然';unn.className='unnatural';
    const existing=evaluations.find(e=>e.mizukiMessageId===m.id);
    if(existing){
      (existing.evaluation==='natural'?nat:unn).classList.add('selected');
    }
    ev.append(nat,unn);wrap.appendChild(ev);

    const improve=document.createElement('div');improve.className='improve'+(existing?.evaluation==='unnatural'?' show':'');
    const ta=document.createElement('textarea');ta.placeholder='自分ならこう言う（任意）';ta.value=existing?.improvedText||'';
    const acts=document.createElement('div');acts.className='improve-actions';
    const sb=document.createElement('button');sb.className='smallbtn';sb.textContent='改善例を保存';acts.appendChild(sb);
    improve.append(ta,acts);wrap.appendChild(improve);

    function setEval(type){
      let e=evaluations.find(x=>x.mizukiMessageId===m.id);
      const userMsg=[...history].reverse().find(x=>x.speaker==='user'&&x.timestamp<=m.timestamp&&x.scenarioId===m.scenarioId);
      if(!e){
        e={id:uid(),mizukiMessageId:m.id,scenarioId:m.scenarioId,timestamp:new Date().toISOString()};
        evaluations.push(e);
      }
      e.evaluation=type;e.improvedText=ta.value.trim()||null;
      e.scenario={...scenario};
      e.userText=userMsg?.text||null;e.mizukiText=m.text;
      e.analysis={mainTopic:m.mainTopic,semanticMeaning:m.semanticMeaning,meaningKey:m.meaningKey,intent:m.intent,phrasePattern:m.phrasePattern,expression:m.expression,usedName:m.usedName};
      e.logicVersion=VERSION;
      save(K.evals,evaluations);
      nat.classList.toggle('selected',type==='natural');
      unn.classList.toggle('selected',type==='unnatural');
      improve.classList.toggle('show',type==='unnatural');
    }
    nat.onclick=()=>setEval('natural');
    unn.onclick=()=>setEval('unnatural');
    sb.onclick=()=>{setEval('unnatural');alert('改善例を保存しました。')};

    const th=document.createElement('div');th.className='thinking'+(settings.debug?' show':'');
    if(m.debug){
      const det=document.createElement('details');
      const sum=document.createElement('summary');sum.textContent='Thinking';
      const pre=document.createElement('pre');pre.textContent=JSON.stringify(m.debug,null,2);
      det.append(sum,pre);th.appendChild(det);
    }
    wrap.appendChild(th);
  }
  return wrap;
}
function renderHistory(){
  const chat=$('#chat');chat.innerHTML='';
  if(!history.length){const e=document.createElement('div');e.className='empty';e.textContent='この状況を見て、美月に自由に話しかけてください。';chat.appendChild(e)}
  else history.forEach(m=>chat.appendChild(renderMessage(m)));
  requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight);
}
function updateExpression(exp='normal'){
  $('#expressionLabel').textContent=exp;
  $('#avatar').textContent=({normal:'美',smile:'☺',care:'美',serious:'美'})[exp]||'美';
}
function send(){
  const input=$('#input');const text=input.value.trim();if(!text)return;
  addUser(text);input.value='';resizeInput();
  const reply=speak(text);history.push(reply);save(K.history,history);
  longMemory.push({timestamp:reply.timestamp,meaningKey:reply.meaningKey,phrasePattern:reply.phrasePattern,intent:reply.intent,evaluation:null});
  if(longMemory.length>300)longMemory=longMemory.slice(-300);
  save(K.longMemory,longMemory);
  updateExpression(reply.expression);renderHistory();
}
function nextScenario(){
  if(!confirm('次のテストへ進みますか？\\n現在の会話履歴は残したまま、想定状況だけ変更します。'))return;
  scenario=generateScenario();testNo++;save(K.scenario,scenario);save(K.testNo,testNo);chips();
  const divider={id:uid(),timestamp:new Date().toISOString(),speaker:'mizuki',text:'── 想定状況を変更しました ──',scenarioId:scenario.id,mainTopic:'system',semanticMeaning:'scenario_changed',meaningKey:'scenario_changed_'+scenario.id,intent:'inform',expression:'normal',phrasePattern:'system',usedName:false};
  history.push(divider);save(K.history,history);renderHistory();
}
function resizeInput(){
  const el=$('#input');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,112)+'px';
}
function exportJSON(){
  const data={
    app:'Mizuki Conversation Lab',version:VERSION,exportedAt:new Date().toISOString(),
    settings:{callName:settings.callName||null},
    currentScenario:scenario,testNo,
    evaluations,
    conversationHistory:history,
    longMemory,
    coverageSummary:{pairCount:Object.keys(coverage.pairs).length,scenarioCount:coverage.usedScenarios.length}
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='mizuki_conversation_lab_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearType(type){
  const msgs={
    chat:'会話履歴をすべて削除しますか？',
    memory:'Memoryをすべて削除しますか？',
    evaluations:'評価データをすべて削除しますか？'
  };
  if(!confirm(msgs[type]))return;
  if(type==='chat'){history=[];save(K.history,history);renderHistory()}
  if(type==='memory'){longMemory=[];coverage={pairs:{},usedScenarios:[]};save(K.longMemory,longMemory);save(K.coverage,coverage)}
  if(type==='evaluations'){evaluations=[];save(K.evals,evaluations);renderHistory()}
}
function manualScenario(){
  const labels=['勤務状態','時間帯','仕事量','次予定','完了','曜日系','テストタイプ'];
  const keys=['workStatus','timeBand','workload','nextPlan','completed','dayType','testType'];
  for(let i=0;i<keys.length;i++){
    const arr=levels[keys[i]];
    const ans=prompt(labels[i]+'\\n'+arr.map((x,n)=>(n+1)+': '+x).join('\\n')+'\\n番号を入力',String(Math.max(1,arr.indexOf(scenario[keys[i]])+1)));
    if(ans===null) return;
    const n=Number(ans)-1;if(arr[n])scenario[keys[i]]=arr[n];
  }
  scenario=validateScenario(scenario);scenario.id=uid();scenario.actualCreatedAt=new Date().toISOString();
  save(K.scenario,scenario);chips();alert('想定状況を変更しました。');
}

$('#sendBtn').onclick=send;
$('#input').addEventListener('input',resizeInput);
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#nextTestBtn').onclick=nextScenario;
$('#settingsBtn').onclick=()=>{$('#settingsOverlay').classList.add('show')};
$('#closeSettings').onclick=()=>{
  settings.callName=$('#callName').value.trim();
  settings.debug=$('#debugToggle').checked;save(K.settings,settings);
  $('#settingsOverlay').classList.remove('show');renderHistory();
};
$('#settingsOverlay').addEventListener('click',e=>{if(e.target===$('#settingsOverlay'))$('#closeSettings').click()});
$('#exportBtn').onclick=exportJSON;
$('#manualScenarioBtn').onclick=manualScenario;
document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearType(b.dataset.clear));
$('#callName').value=settings.callName||'';
$('#debugToggle').checked=!!settings.debug;

chips();renderHistory();
const last=[...history].reverse().find(x=>x.speaker==='mizuki');if(last)updateExpression(last.expression);
})();
</script>
